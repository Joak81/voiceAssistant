[project]
name = "voice-onboard-webhooks"
version = "0.1.0"
description = "Webhooks FastAPI para o AI receptionist (Retell AI) — voice-onboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
